    - generic [ref=e172]:
      - article [ref=e173]:
        - button "Quem é a Eugen.IA?" [ref=e174]:
          - generic [ref=e175]: Quem é a Eugen.IA?
          - img [ref=e176]
        - generic [ref=e178]:
          - paragraph [ref=e179]: "A Eugen.IA nasceu de um lugar muito específico: 11 anos operando negócios físicos e digitais no Brasil, vendo de perto o quanto uma operação desorganizada consome o tempo de quem deveria estar crescendo."
          - paragraph [ref=e180]: A maioria das empresas que chega até nós passa pelo mesmo ciclo. Adotam ferramentas antes de entender o gargalo. Implementam soluções sem mapear o processo. Gastam em tecnologia e ficam sem retorno. O problema nunca foi a ferramenta. Foi a falta de diagnóstico antes dela.
          - paragraph [ref=e181]: Acreditamos que IA bem implementada começa pelo mapeamento. Antes de qualquer proposta, entendemos o que está travando, priorizamos o que gera impacto real e construímos soluções que a sua equipe atual consegue operar.
          - paragraph [ref=e182]: Somos uma agência de implementação, construída por quem conhece a operação por dentro. Nosso método de trabalho é baseado no Design Sprint do Google, adaptado para a realidade das PMEs brasileiras. Resultado visível desde o primeiro mês, escopo fechado antes do desenvolvimento começar e entrega em torno de 7-15 dias.
          - paragraph [ref=e183]: Não prometemos resultado. Garantimos ele.
      - article [ref=e184]:
        - button "Já investi em tecnologia antes e não tive retorno. Por que seria diferente aqui?" [ref=e185]:
          - generic [ref=e186]: Já investi em tecnologia antes e não tive retorno. Por que seria diferente aqui?
          - img [ref=e187]
        - paragraph [ref=e189]: Essa é uma objeção legítima. Na maioria dos casos, o problema não foi a tecnologia, mas a ausência de diagnóstico antes da implementação. A Eugen.IA começa pelo mapeamento. Antes de qualquer proposta, entendemos o que está travando e só depois definimos o que construir e o impacto esperado de cada etapa. Você não decide investir no escuro.
      - article [ref=e190]:
        - button "E se não tenho tempo agora para implementar uma coisa nova?" [ref=e191]:
          - generic [ref=e192]: E se não tenho tempo agora para implementar uma coisa nova?
          - img [ref=e193]
        - paragraph [ref=e195]: Esse é o paradoxo mais honesto do processo. A falta de tempo normalmente é causada pelos problemas que a automação resolveria. Você não precisa parar tudo para começar. A implementação pode começar pelo gargalo de maior impacto, justamente para liberar tempo.
      - article [ref=e196]:
        - button "IA substitui minha equipe?" [ref=e197]:
          - generic [ref=e198]: IA substitui minha equipe?
          - img [ref=e199]
        - paragraph [ref=e201]: Não é o objetivo e não é o que acontece na prática. IA bem implementada reduz tarefas repetitivas para que sua equipe passe a fazer o que exige julgamento, relacionamento e decisão humana. A questão não é substituição. É redirecionamento.
      - article [ref=e202]:
        - button "Não vou perder o controle ao automatizar processos?" [ref=e203]:
          - generic [ref=e204]: Não vou perder o controle ao automatizar processos?
          - img [ref=e205]
        - paragraph [ref=e207]: Esse medo é comum e faz sentido. Automatizar não é abrir mão do controle. É transformar processos manuais e sujeitos a erro em fluxos rastreáveis, documentados e auditáveis. Qualquer automação que construímos pode ser interrompida, ajustada ou revertida. O controle continua sendo seu.
      - article [ref=e208]:
        - button "Minha operação é muito específica. Existe solução pronta para o que eu tenho?" [ref=e209]:
          - generic [ref=e210]: Minha operação é muito específica. Existe solução pronta para o que eu tenho?
          - img [ref=e211]
        - paragraph [ref=e213]: Não existe solução pronta, e não é isso que a Eugen.IA oferece. Cada projeto começa pelo mapeamento do seu cenário específico, do seu stack, dos seus processos e dos seus gargalos. A especificidade da sua operação não é obstáculo. É o briefing do que precisa ser construído.
      - article [ref=e214]:
        - button "Qual o investimento?" [ref=e215]:
          - generic [ref=e216]: Qual o investimento?
          - img [ref=e217]
        - paragraph [ref=e219]: "Depende do escopo e todo projeto é sob medida. Depois de mapear sua operação, você recebe uma proposta com escopo claro, entregáveis definidos e investimento transparente. A pergunta mais útil antes do preço costuma ser outra: quanto custa manter a operação do jeito que está por mais 6 meses?"
      - article [ref=e220]:
        - button "Minha empresa não tem equipe técnica. Conseguimos usar o que vocês constroem?" [ref=e221]:
          - generic [ref=e222]: Minha empresa não tem equipe técnica. Conseguimos usar o que vocês constroem?
          - img [ref=e223]
        - paragraph [ref=e225]: Sim. Construímos para que sua equipe atual consiga operar sem precisar chamar ninguém para o dia a dia. Negócios menores ganham proporcionalmente mais porque cada hora economizada pesa mais na operação enxuta. O tamanho da sua empresa não é uma barreira, é exatamente o perfil que mais se beneficia de uma automação bem feita.
