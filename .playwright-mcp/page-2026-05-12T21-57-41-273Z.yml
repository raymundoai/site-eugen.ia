    - generic [ref=e161]:
      - article [ref=e162]:
        - button "Quem é a Eugen.IA?" [ref=e163]:
          - generic [ref=e164]: Quem é a Eugen.IA?
          - img [ref=e165]
        - generic [ref=e167]:
          - paragraph [ref=e168]: "A Eugen.IA nasceu de um lugar muito específico: 11 anos operando negócios físicos e digitais no Brasil, vendo de perto o quanto uma operação desorganizada consome o tempo de quem deveria estar crescendo."
          - paragraph [ref=e169]: A maioria das empresas que chega até nós passa pelo mesmo ciclo. Adotam ferramentas antes de entender o gargalo. Implementam soluções sem mapear o processo. Gastam em tecnologia e ficam sem retorno. O problema nunca foi a ferramenta. Foi a falta de diagnóstico antes dela.
          - paragraph [ref=e170]: Acreditamos que IA bem implementada começa pelo mapeamento. Antes de qualquer proposta, entendemos o que está travando, priorizamos o que gera impacto real e construímos soluções que a sua equipe atual consegue operar.
          - paragraph [ref=e171]: Somos uma agência de implementação, construída por quem conhece a operação por dentro. Nosso método de trabalho é baseado no Design Sprint do Google, adaptado para a realidade das PMEs brasileiras. Resultado visível desde o primeiro mês, escopo fechado antes do desenvolvimento começar e entrega em torno de 7-15 dias.
          - paragraph [ref=e172]: Não prometemos resultado. Garantimos ele.
      - article [ref=e173]:
        - button "Já investi em tecnologia antes e não tive retorno. Por que seria diferente aqui?" [ref=e174]:
          - generic [ref=e175]: Já investi em tecnologia antes e não tive retorno. Por que seria diferente aqui?
          - img [ref=e176]
        - paragraph [ref=e178]: Essa é uma objeção legítima. Na maioria dos casos, o problema não foi a tecnologia, mas a ausência de diagnóstico antes da implementação. A Eugen.IA começa pelo mapeamento. Antes de qualquer proposta, entendemos o que está travando e só depois definimos o que construir e o impacto esperado de cada etapa. Você não decide investir no escuro.
      - article [ref=e179]:
        - button "E se não tenho tempo agora para implementar uma coisa nova?" [ref=e180]:
          - generic [ref=e181]: E se não tenho tempo agora para implementar uma coisa nova?
          - img [ref=e182]
        - paragraph [ref=e184]: Esse é o paradoxo mais honesto do processo. A falta de tempo normalmente é causada pelos problemas que a automação resolveria. Você não precisa parar tudo para começar. A implementação pode começar pelo gargalo de maior impacto, justamente para liberar tempo.
